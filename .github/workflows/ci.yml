name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt'd:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -o omt .

      - name: go test
        run: go test ./... -race -cover

  lint:
    name: Static analysis (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  security:
    name: Security check (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: securego/gosec@v2.28.0
        with:
          args: ./...

  dependencies:
    name: Dependency check (govulncheck + go mod tidy/verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go mod verify
        run: go mod verify

      - name: go mod tidy (must be a no-op)
        run: |
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          diff -u go.mod.orig go.mod
          diff -u go.sum.orig go.sum

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
